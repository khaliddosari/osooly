name: CI

# Keep the tests + production build green on every push and PR (CLAUDE.md:
# "keep them green"; CI wiring lands in S10). No secrets needed: the build
# reads runtime config at request time, not at build time.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22 still bundles npm 10.x; the committed lockfile was generated
      # with npm 11, and npm ci rejects lockfiles from a newer npm than its
      # own. Pin to match so ci doesn't drift from local installs.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build
