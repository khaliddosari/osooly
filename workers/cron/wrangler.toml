# Osooly market-refresh Cron Worker (S4). Separate Wrangler project from the
# Next.js app (root wrangler.toml) but bound to the SAME D1 database — the
# shared market_snapshot cache (PRD §3.5a rule 1).
#
# Local dev (from the repo root, so the worker shares the Next app's local D1):
#   npx wrangler dev --config workers/cron/wrangler.toml \
#       --persist-to .wrangler/state --test-scheduled
#   curl "http://localhost:8787/__scheduled?cron=0+22+*+*+*"      # gold
#
# Secrets: copy .dev.vars.example (next to this file) to .dev.vars for local
# runs; production uses `wrangler secret put --config workers/cron/wrangler.toml`.

name = "osooly-cron"
main = "index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Refresh cadences per PRD §3.6 (UTC; AST = UTC+3). The expressions must
# match the CRON_* constants in index.ts byte-for-byte — dispatch keys on
# controller.cron. Cloudflare numbers weekdays 1=Sunday..7=Saturday (not the
# 0=Sunday Unix convention), so Sun-Thu is 1-5.
[triggers]
crons = [
  "* 7-11 * * 1-5", # stocks: every minute, Sun-Thu 10:00-14:59 AST (Tadawul hours)
  "0 22 * * *",     # jewelry (gold spot): nightly 01:00 AST
  "30 22 * * *",    # autos (Syarah + Haraj): nightly 01:30 AST
  "0 23 * * *",     # real estate (REGA + Aqar): nightly 02:00 AST
  "30 23 * * *",    # news corpus (RSS -> Vectorize): nightly 02:30 AST
]

# Price alerts (PRD 3.8a): after each refresh the scheduled handler evaluates
# that class's alerts and POSTs matches to ALERTS_WEBHOOK_URL; the Worker's
# fetch handler exposes POST /alert-delivery for n8n's confirmation callback.
# ALERTS_WEBHOOK_URL / ALERTS_WEBHOOK_TOKEN are secrets (see .dev.vars.example),
# set in prod with `wrangler secret put`. S10 adds the route that makes
# /alert-delivery publicly reachable.

# RAG bindings for the news refresh (PRD 3.6). Local dev still runs without
# these: wrangler has no local Vectorize simulator, so the job logs a clean
# skip. The `osooly-rag` index exists in production as of S10.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "osooly-rag"

[[d1_databases]]
binding = "DB"
database_name = "osooly"
# Real production database, same id as the root wrangler.toml (S10).
database_id = "0666115c-f2a2-421e-9977-736210a342be"
migrations_dir = "../../migrations"
