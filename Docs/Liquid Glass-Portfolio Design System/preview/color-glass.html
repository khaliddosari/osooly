<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .pane { width:200px; height:104px; border-radius:14px; display:flex; align-items:flex-end; padding:12px; }
  .name { font-family:var(--font-heading); font-size:12px; font-weight:600; color:var(--text-primary); }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); margin-top:4px; }
</style>
</head>
<body>
  <div class="row" style="gap:18px;">
    <div class="col" style="gap:8px;">
      <div class="pane glass"></div>
      <span class="name">glass surface</span>
      <span class="meta">blur(24px) saturate(180%) · 12% hairline</span>
    </div>
    <div class="col" style="gap:8px;">
      <div class="pane glass" style="background:var(--glass-bg-hover); box-shadow:var(--glass-highlight), var(--glass-shadow-hover);"></div>
      <span class="name">glass · hover</span>
      <span class="meta">brighter fill + cyan glow shadow</span>
    </div>
  </div>
</body>
</html>
