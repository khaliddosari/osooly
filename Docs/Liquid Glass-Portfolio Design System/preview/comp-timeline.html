<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .timeline { position:relative; padding-left:32px; max-width:560px; }
  .timeline::before { content:''; position:absolute; left:0; top:6px; bottom:6px; width:2px; background:var(--border); }
  .dot { position:absolute; left:-37px; top:20px; width:12px; height:12px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 12px rgba(79,195,247,0.4); }
  .content { position:relative; padding:18px 20px; border-radius:var(--radius); background:var(--glass-bg);
    border:var(--glass-border); backdrop-filter:var(--glass-blur); box-shadow:var(--glass-highlight), var(--glass-shadow); }
  .hd { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .hd img { width:42px; height:42px; border-radius:8px; object-fit:contain; }
  h3 { font-family:var(--font-heading); font-size:1.05rem; font-weight:600; }
  .org { color:var(--accent); font-size:0.85rem; font-weight:500; }
  .date { color:var(--text-secondary); font-size:0.8rem; font-family:var(--font-mono); }
</style>
</head>
<body>
  <div class="timeline">
    <div class="dot"></div>
    <div class="content">
      <div class="hd">
        <img src="../assets/logos/council-logo.jpg" alt="">
        <div><h3>Media &amp; Design Deputy Lead</h3><span class="org">CCIS Student Council</span></div>
      </div>
      <span class="date">September 2025 — Present</span>
    </div>
  </div>
</body>
</html>
