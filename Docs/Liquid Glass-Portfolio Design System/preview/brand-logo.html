<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding:20px 26px; display:flex; align-items:center; gap:30px; }
  .hero-mark { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .name { font-family:var(--font-heading); font-size:13px; font-weight:700; color:var(--text-primary); }
  .sub { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); }
  .sizes { display:flex; align-items:center; gap:24px; }
  .usage { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .ulabel { font-family:var(--font-mono); font-size:9.5px; color:var(--text-secondary); }
  .avatar { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 35%, #11202b, #07090d);
    border:1px solid rgba(79,195,247,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 18px rgba(79,195,247,0.4); }
</style>
</head>
<body>

  <div class="hero-mark">
    <svg width="132" height="132" viewBox="0 0 84 84" fill="none">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="84" y2="84">
          <stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#1aa3e8"/>
        </linearGradient>
        <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge>
            <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g filter="url(#neon)">
        <polygon points="42,12 68,27 68,57 42,72 16,57 16,27" fill="url(#lg)" fill-opacity="0.08" stroke="#6fd4ff" stroke-width="2"/>
        <path d="M42 12 L42 42 M68 27 L42 42 M16 57 L42 42" stroke="#aee6ff" stroke-opacity="0.85" stroke-width="1.4"/>
        <circle cx="42" cy="42" r="6" fill="#dff5ff"/>
      </g>
      <circle cx="42" cy="42" r="13" fill="#4fc3f7" fill-opacity="0.22"/>
    </svg>
    <div class="name">Liquid Glass</div>
    <div class="sub">primary mark · neon hex prism</div>
  </div>

  <div class="sizes">
    <div class="usage">
      <svg width="56" height="56" viewBox="0 0 84 84" fill="none">
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="84" y2="84"><stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#1aa3e8"/></linearGradient>
          <filter id="neon2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <g filter="url(#neon2)">
          <polygon points="42,12 68,27 68,57 42,72 16,57 16,27" fill="url(#lg2)" fill-opacity="0.08" stroke="#6fd4ff" stroke-width="2.4"/>
          <path d="M42 12 L42 42 M68 27 L42 42 M16 57 L42 42" stroke="#aee6ff" stroke-opacity="0.85" stroke-width="1.8"/>
          <circle cx="42" cy="42" r="6.5" fill="#dff5ff"/>
        </g>
      </svg>
      <div class="ulabel">56 · nav</div>
    </div>

    <div class="usage">
      <div class="avatar">
        <svg width="38" height="38" viewBox="0 0 84 84" fill="none">
          <defs><linearGradient id="lg3" x1="0" y1="0" x2="84" y2="84"><stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#1aa3e8"/></linearGradient></defs>
          <polygon points="42,12 68,27 68,57 42,72 16,57 16,27" fill="url(#lg3)" fill-opacity="0.1" stroke="#7fdaff" stroke-width="3"/>
          <path d="M42 12 L42 42 M68 27 L42 42 M16 57 L42 42" stroke="#cdefff" stroke-opacity="0.9" stroke-width="2"/>
          <circle cx="42" cy="42" r="7" fill="#eaf9ff"/>
        </svg>
      </div>
      <div class="ulabel">avatar</div>
    </div>

    <div class="usage">
      <svg width="26" height="26" viewBox="0 0 84 84" fill="none">
        <defs><linearGradient id="lg4" x1="0" y1="0" x2="84" y2="84"><stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#1aa3e8"/></linearGradient></defs>
        <polygon points="42,12 68,27 68,57 42,72 16,57 16,27" fill="url(#lg4)" fill-opacity="0.12" stroke="#7fdaff" stroke-width="4"/>
        <circle cx="42" cy="42" r="9" fill="#eaf9ff"/>
      </svg>
      <div class="ulabel">16 · favicon</div>
    </div>
  </div>

</body>
</html>
