<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .cert { width:420px; padding:22px; border-radius:var(--radius); display:flex; gap:18px; align-items:flex-start;
    background:var(--glass-bg); border:var(--glass-border); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-highlight), var(--glass-shadow); }
  .cert img { width:64px; height:64px; border-radius:8px; object-fit:contain; flex-shrink:0; }
  h3 { font-family:var(--font-heading); font-size:1.02rem; font-weight:600; line-height:1.3; margin-bottom:4px; }
  .org { color:var(--accent); font-size:0.85rem; font-weight:500; margin-bottom:2px; }
  .date { color:var(--text-secondary); font-size:0.78rem; font-family:var(--font-mono); margin-bottom:12px; }
  .btn-sm { display:inline-block; padding:6px 14px; border-radius:6px; font-size:0.78rem; font-family:var(--font-heading);
    font-weight:500; background:var(--accent-gradient); color:#000;
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.35), 0 4px 12px rgba(79,195,247,0.2); }
  .btn-sm i { margin-right:5px; }
</style>
</head>
<body>
  <div class="cert">
    <img src="../assets/logos/deeplearningai_logo.jpg" alt="">
    <div>
      <h3>Supervised Machine Learning: Regression and Classification</h3>
      <div class="org">DeepLearning.AI</div>
      <div class="date">April 2026</div>
      <a class="btn-sm"><i class="fas fa-external-link-alt"></i>Verify</a>
    </div>
  </div>
</body>
</html>
