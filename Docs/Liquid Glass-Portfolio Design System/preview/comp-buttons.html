<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .btn { display:inline-block; font-family:var(--font-heading); font-weight:500; cursor:pointer; border:none; }
  .btn-primary { padding:12px 28px; border-radius:8px; font-size:0.95rem; background:var(--accent-gradient); color:#000;
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.4), inset 0 -1px 0 0 rgba(0,0,0,0.2), 0 6px 20px rgba(79,195,247,0.25); }
  .btn-sm { padding:6px 14px; border-radius:6px; font-size:0.8rem; background:var(--accent-gradient); color:#000;
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.35), 0 4px 12px rgba(79,195,247,0.2); }
  .btn-outline { padding:12px 28px; border-radius:8px; font-size:0.95rem; background:var(--glass-bg); color:var(--accent);
    border:var(--glass-border); backdrop-filter:var(--glass-blur); box-shadow:var(--glass-highlight); }
  .lbl { margin-top:10px; }
</style>
</head>
<body>
  <div class="row" style="gap:18px;">
    <div class="col" style="gap:0;"><a class="btn btn-primary">View My Work</a><span class="lbl">btn-primary</span></div>
    <div class="col" style="gap:0;"><a class="btn btn-outline">Outline</a><span class="lbl">btn-outline (glass)</span></div>
    <div class="col" style="gap:0;"><a class="btn btn-sm">Verify</a><span class="lbl">btn-sm</span></div>
  </div>
</body>
</html>
