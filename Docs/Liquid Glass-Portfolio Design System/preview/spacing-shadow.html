<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .card { width:150px; height:80px; border-radius:14px; background:#15151c; border:1px solid rgba(255,255,255,0.08); }
  .rest { box-shadow:var(--glass-shadow); }
  .hover { box-shadow:var(--glass-shadow-hover); }
  .bevel { box-shadow:var(--glass-highlight); background:var(--glass-bg); }
  .name { font-family:var(--font-heading); font-size:12px; font-weight:600; }
  .val { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="row" style="gap:18px;">
    <div class="col" style="gap:8px;"><div class="card rest"></div><span class="name">shadow</span><span class="val">0 12px 40px /.35</span></div>
    <div class="col" style="gap:8px;"><div class="card hover"></div><span class="name">shadow · hover</span><span class="val">+ 0 0 40px cyan</span></div>
    <div class="col" style="gap:8px;"><div class="card bevel"></div><span class="name">inset bevel</span><span class="val">glass-highlight</span></div>
  </div>
</body>
</html>
