<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .mono-lg { font-family:var(--font-mono); font-size:22px; font-weight:500; color:var(--text-primary); letter-spacing:0.02em; }
  .glyphs { font-family:var(--font-mono); font-size:15px; color:var(--text-secondary); margin-top:6px; }
  .chip { font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--accent);
    background:linear-gradient(135deg, rgba(79,195,247,0.18), rgba(79,195,247,0.06));
    padding:5px 14px; border-radius:20px; border:1px solid rgba(79,195,247,0.2); }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-top:12px; }
</style>
</head>
<body>
  <div class="mono-lg">JetBrains Mono</div>
  <div class="glyphs">FastAPI · LangChain · 0123456789 · {} =&gt; () []</div>
  <div class="row" style="margin-top:14px;">
    <span class="chip">Python</span><span class="chip">PyTorch</span><span class="chip">Next.js</span><span class="chip">Docker</span>
  </div>
  <div class="meta">Mono carries technical labels, tags, dates &amp; code accents</div>
</body>
</html>
