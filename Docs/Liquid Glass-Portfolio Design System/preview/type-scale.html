<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding:24px 26px; }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .item { display:flex; align-items:baseline; gap:16px; }
  .spec { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); width:120px; flex-shrink:0; }
  .h1 { font-family:var(--font-heading); font-size:34px; font-weight:700; letter-spacing:-0.5px; }
  .h2 { font-family:var(--font-heading); font-size:26px; font-weight:700; }
  .h3 { font-family:var(--font-heading); font-size:18px; font-weight:600; }
  .body { font-family:var(--font); font-size:16px; color:var(--text-secondary); line-height:1.7; max-width:420px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="item"><span class="spec">IBM Plex · 700</span><span class="h1">Khalid Al Dosari</span></div>
    <div class="item"><span class="spec">IBM Plex · 700</span><span class="h2">Section Title</span></div>
    <div class="item"><span class="spec">IBM Plex · 600</span><span class="h3">Namtheg AutoML</span></div>
    <div class="item"><span class="spec">Inter · 400</span><span class="body">I design scalable, production-ready solutions that turn raw data into actionable insights.</span></div>
  </div>
</body>
</html>
