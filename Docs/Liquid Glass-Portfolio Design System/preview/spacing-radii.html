<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .box { background:var(--glass-bg); border:var(--glass-border); display:flex; align-items:center; justify-content:center;
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); box-shadow:var(--glass-highlight); }
  .name { font-family:var(--font-heading); font-size:12px; font-weight:600; }
  .val { font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="row" style="gap:20px;">
    <div class="col" style="gap:8px;"><div class="box" style="width:90px;height:64px;border-radius:8px;"></div><span class="name">radius-sm</span><span class="val">8px</span></div>
    <div class="col" style="gap:8px;"><div class="box" style="width:90px;height:64px;border-radius:16px;"></div><span class="name">radius</span><span class="val">16px</span></div>
    <div class="col" style="gap:8px;"><div class="box" style="width:120px;height:38px;border-radius:20px;"></div><span class="name">radius-pill</span><span class="val">20px</span></div>
  </div>
</body>
</html>
