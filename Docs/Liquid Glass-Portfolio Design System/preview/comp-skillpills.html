<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .grp-title { font-family:var(--font-heading); font-size:1rem; font-weight:600; color:var(--accent); margin-bottom:14px; }
  .skill-tag { background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:var(--glass-border); padding:8px 16px; border-radius:20px; font-family:var(--font-mono); font-size:0.85rem; font-weight:500;
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.12), inset 0 -1px 0 0 rgba(0,0,0,0.15); color:var(--text-primary); font-weight:600; }
  .skill-tag.hot { background:linear-gradient(135deg, rgba(79,195,247,0.2), rgba(79,195,247,0.05));
    border-color:rgba(79,195,247,0.4); color:var(--accent); }
</style>
</head>
<body>
  <div class="grp-title">Specialized Domains</div>
  <div class="row">
    <span class="skill-tag">Machine Learning</span><span class="skill-tag hot">Deep Learning</span>
    <span class="skill-tag">NLP</span><span class="skill-tag">Computer Vision</span>
    <span class="skill-tag">Agentic AI</span><span class="skill-tag">MLOps</span>
  </div>
</body>
</html>
